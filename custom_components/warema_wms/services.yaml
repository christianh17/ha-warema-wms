set_position_and_valance:
  name: "Position + Volant gemeinsam setzen"
  description: >
    Setzt die Hauptposition UND einen Volant-Zielwert in EINEM Funkbefehl.
    Nutzen statt zweier separater cover.set_cover_position-Aufrufe (einmal
    auf das Haupt-Cover, einmal auf das Volant-Cover), wenn beide denselben
    physischen Motor ansteuern (z.B. Markise mit Volant) - zwei getrennte
    Befehle kurz hintereinander können sich sonst gegenseitig unterbrechen
    und den Volant-Fahrbefehl abbrechen (beobachtet an echter Hardware,
    2026-08). position/valance_1/valance_2 nutzen dieselbe rohe 0-100%-
    Konvention wie der "WMS Position"-Sensor (0=auf, 100=zu) - NICHT die
    gespiegelte Dashboard-Konvention.
  fields:
    entity_id:
      name: "Cover-Entity"
      description: "Die Haupt-Cover-Entity der Markise (nicht die Volant-Entity)."
      required: true
      selector:
        entity:
          domain: cover
          integration: warema_wms
    position:
      name: "Zielposition (%)"
      description: "0 = offen/eingefahren, 100 = geschlossen/ausgefahren."
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    valance_1:
      name: "Ziel Volant 1 (%)"
      description: "0 = eingefahren/oben, 100 = ausgefahren/unten. Leer lassen, um Volant 1 nicht zu ändern."
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    valance_2:
      name: "Ziel Volant 2 (%)"
      description: "Nur bei Produkten mit zwei Volants relevant. Leer lassen, um Volant 2 nicht zu ändern."
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"