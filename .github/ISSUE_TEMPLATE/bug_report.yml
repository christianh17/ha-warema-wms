name: 🐞 Bug Report
description: Report a problem with the Warema WMS integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below so the issue can be reproduced.
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.6.0"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      placeholder: "v1.0.3"
    validations:
      required: true
  - type: dropdown
    id: device-type
    attributes:
      label: Device type(s)
      multiple: true
      options:
        - "20 – Actuator UP"
        - "21 – Plug receiver"
        - "25 – Radio motor"
        - "2A – Radio motor (Lamellendach L60/L70)"
        - "2E – Actuator 230V UP"
        - "06 – Weather station"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Settings → System → Logs, or enable debug logging for custom_components.warema_wms.
      render: shell
    validations:
      required: false
